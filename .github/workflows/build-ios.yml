name: Build iOS Unsigned IPA (iOS 14.0 Pure)

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Fetch Original Code
        uses: actions/checkout@v4
        with:
          repository: liuchuancong/pure_live
          ref: master

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install Flutter dependencies
        run: |
          mkdir -p build/ios/SourcePackages
          mkdir -p build/macos/SourcePackages
          flutter pub get

      - name: Patch Plugin Source Codes
        run: |
          find ~/.pub-cache/hosted/pub.dev/device_info_plus* \( -name "*.m" -o -name "*.h" \) -type f -exec sed -i '' 's/isiOSAppOnVision/isLowPowerModeEnabled/g' {} +
          find ~/.pub-cache/hosted/pub.dev/better_player_plus* -name "BetterPlayerPlugin.h" -type f -exec sh -c 'echo "\n#if __has_include(<better_player_plus/better_player_plus-Swift.h>)\n#import <better_player_plus/better_player_plus-Swift.h>\n#endif" >> "$1"' _ {} \;

      - name: Install iOS Pods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Post-Pod Surgery (Nuke Privacy Targets & Fix iOS 14)
        run: |
          find ios/Pods -name "*.sh" -type f -exec sed -i '' -E '/privacy\.bundle/Id' {} +
          find ios/Pods -name "*.sh" -type f -exec sed -i '' -E '/PrivacyInfo\.xcprivacy/Id' {} +

          gem install xcodeproj
          ruby <<-'EOF'
          require "xcodeproj"

          # ==========================================
          # 第一部分：修复主工程 (Runner.xcodeproj)
          # ==========================================
          proj = Xcodeproj::Project.open("ios/Runner.xcodeproj")
          runner = proj.targets.find { |t| t.name == "Runner" }
          ext = proj.targets.find { |t| t.name == "ShareExtension" }

          if runner && ext
            runner_config = runner.build_configurations.find { |c| c.name == "Release" }
            runner_id = runner_config.build_settings["PRODUCT_BUNDLE_IDENTIFIER"] || "com.mystyle.purelive.liu"
            ext.build_configurations.each { |c| c.build_settings["PRODUCT_BUNDLE_IDENTIFIER"] = "#{runner_id}.ShareExtension" }
          end

          if runner
            runner.build_phases.delete_if { |phase| phase.isa == "PBXShellScriptBuildPhase" && phase.name == "Thin Binary" }
          end

          proj.targets.each do |target|
            target.build_configurations.each do |config|
              # 🌟 统一将主程序降级到 14.0
              config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "14.0"
              config.build_settings["ENABLE_BITCODE"] = "NO"
              
              if target.name == "Runner"
                ldflags = config.build_settings["OTHER_LDFLAGS"] || ["$(inherited)"]
                ldflags = [ldflags] if ldflags.is_a?(String)
                
                ldflags << "-weak_framework" << "AVFAudio" unless ldflags.include?("AVFAudio")
                ["-Wl,-weak-lswift_Concurrency", "-Wl,-weak-lswift_StringProcessing", "-Wl,-weak-lswift_RegexParser"].each { |lib| ldflags << lib unless ldflags.include?(lib) }
                config.build_settings["OTHER_LDFLAGS"] = ldflags.uniq
              end
            end
          end
          proj.save

          # ==========================================
          # 第二部分：爆破插件工程 (Pods.xcodeproj)
          # ==========================================
          pods_proj = Xcodeproj::Project.open("ios/Pods/Pods.xcodeproj")

          pods_proj.targets.each do |t|
            t.build_configurations.each do |c|
              # 🌟 统一将所有插件（包括刺头插件）降级到 14.0，不再拔高到 15.0！
              c.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "14.0"
              
              if t.name.include?("better_player_plus")
                c.build_settings["DEFINES_MODULE"] = "YES"
                c.build_settings["CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES"] = "YES"
              end
            end
          end

          privacy_targets = pods_proj.targets.select { |t| t.name.downcase.include?("privacy") }
          privacy_targets.each do |pt|
            pods_proj.targets.each { |t| t.dependencies.delete_if { |dep| dep.target == pt } }
            pt.remove_from_project
          end

          pods_proj.targets.each do |t|
            t.build_phases.each do |phase|
              phase.files.delete_if do |f|
                path = f.file_ref&.path || f.file_ref&.name || ""
                path.downcase.include?("privacy.bundle") || path.downcase.include?("privacyinfo")
              end
            end
          end
          pods_proj.save
          EOF

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package into .ipa
        run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r pure_live.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pure_live-ios-app
          path: build/ios/iphoneos/pure_live.ipa
