name: Build iOS Unsigned IPA (Ultimate Privacy Fix)

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Fetch Original Code
        uses: actions/checkout@v4
        with:
          repository: liuchuancong/pure_live
          ref: master

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. 禁用 SPM，避开 Firebase 强制 iOS 15 的报错
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install Flutter dependencies
        run: |
          mkdir -p build/ios/SourcePackages
          mkdir -p build/macos/SourcePackages
          flutter pub get

      # 🌟【全新核弹级补丁】物理清洗：在 CocoaPods 运行前，直接从所有下载的插件库中抹除“隐私清单”的定义！
      # 这样 CocoaPods 根本就不会去生成那些导致报错的 _privacy.bundle 目标！
      - name: Nuke Privacy Manifests (Fix CocoaPods Bundle Bug)
        run: |
          find ~/.pub-cache/hosted/pub.dev -name "*.podspec" -type f -exec sed -i '' '/_privacy/d' {} +
          find ~/.pub-cache/hosted/pub.dev -name "*.podspec" -type f -exec sed -i '' '/PrivacyInfo.xcprivacy/d' {} +

      - name: Patch Vision Pro Bug in Plugin
        run: |
          find ~/.pub-cache/hosted/pub.dev/device_info_plus* \( -name "*.m" -o -name "*.h" \) -type f -exec sed -i '' 's/isiOSAppOnVision/isLowPowerModeEnabled/g' {} +

      # 2. 依然保持我们引以为傲的“精准提级”和“iOS 14.3 弱链接全家桶”
      - name: Precision iOS Target Patch
        run: |
          gem install xcodeproj
          ruby <<-'EOF'
          require "xcodeproj"
          
          # A. 全局降级 13.0，针对刺头插件单独提级 15.0
          podfile_path = "ios/Podfile"
          if File.exist?(podfile_path)
            content = File.read(podfile_path)
            macro = "flutter_additional_ios_build_settings(target)"
            if content.include?(macro)
              patch = "flutter_additional_ios_build_settings(target)\n" \
                      "      target.build_configurations.each do |c|\n" \
                      "        c.build_settings['ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES'] = 'YES'\n" \
                      "        if target.name == 'file_picker' || target.name.include?('firebase') || target.name.include?('cloud_firestore')\n" \
                      "           c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'\n" \
                      "        else\n" \
                      "           c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'\n" \
                      "        end\n" \
                      "      end"
              content.gsub!(macro, patch)
              File.write(podfile_path, content)
            end
          end
          
          project = Xcodeproj::Project.open("ios/Runner.xcodeproj")
          runner = project.targets.find { |t| t.name == "Runner" }
          ext = project.targets.find { |t| t.name == "ShareExtension" }
          
          # B. 同步 Bundle ID
          if runner && ext
            runner_config = runner.build_configurations.find { |c| c.name == "Release" }
            runner_id = runner_config.build_settings["PRODUCT_BUNDLE_IDENTIFIER"] || "com.mystyle.purelive.liu"
            ext.build_configurations.each do |c|
              c.build_settings["PRODUCT_BUNDLE_IDENTIFIER"] = "#{runner_id}.ShareExtension"
            end
          end
          
          if runner
            # C. 删掉死循环脚本
            runner.build_phases.delete_if { |phase| phase.isa == "PBXShellScriptBuildPhase" && phase.name == "Thin Binary" }
            # D. 清理主工程可能遗留的隐私文件引用
            resources_phase = runner.build_phases.find { |phase| phase.isa == "PBXResourcesBuildPhase" }
            if resources_phase
              resources_phase.files.delete_if do |f|
                path = f.file_ref&.path || f.file_ref&.name || ""
                path.include?("_privacy.bundle")
              end
            end
          end
          
          # E. 全局注入 iOS 14 老系统护航补丁
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "13.0"
              config.build_settings["ENABLE_BITCODE"] = "NO"
              
              if target.name == "Runner"
                ldflags = config.build_settings["OTHER_LDFLAGS"] || ["$(inherited)"]
                ldflags = [ldflags] if ldflags.is_a?(String)
                ["AVFAudio", "CoreMIDI", "UniformTypeIdentifiers"].each { |fw| ldflags << "-weak_framework" << fw unless ldflags.include?(fw) }
                ["-Wl,-weak-lswift_Concurrency", "-Wl,-weak-lswift_StringProcessing", "-Wl,-weak-lswift_RegexParser"].each { |lib| ldflags << lib unless ldflags.include?(lib) }
                config.build_settings["OTHER_LDFLAGS"] = ldflags.uniq
              end
            end
          end
          
          project.save
          EOF

      - name: Install iOS Pods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package into .ipa
        run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r pure_live.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pure_live-ios-app
          path: build/ios/iphoneos/pure_live.ipa
