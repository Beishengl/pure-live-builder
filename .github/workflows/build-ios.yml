name: Build iOS Unsigned IPA (Stable Release)

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Fetch Original Code (Time Machine)
        uses: actions/checkout@v4
        with:
          repository: liuchuancong/pure_live
          # 🌟 终极时光机：不再拉取充满 Bug 的最新代码
          # 我们回退到一个月前发布的最稳定的 2.0.21 版本！
          # 这个版本完美兼容你的 iOS 14.3，不需要任何魔改和手术！
          ref: v2.0.21 

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter dependencies
        run: |
          mkdir -p build/ios/SourcePackages
          mkdir -p build/macos/SourcePackages
          flutter pub get

      - name: Install iOS Pods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build unsigned iOS app
        # 这里加上 --obfuscate 是为了避免老版本的一些特定混淆报错
        run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=./debug_info

      - name: Package into .ipa
        run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r pure_live.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pure_live-ios-app
          path: build/ios/iphoneos/pure_live.ipa
